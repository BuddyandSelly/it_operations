plugins: rubocop-rspec

# RuboCop replaces its default AllCops/Exclude with the one below instead of
# adding to it, and CI installs the bundle into vendor/bundle, where a gem with
# a .rubocop.yml of its own would be picked up.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

RSpec/BeforeAfterAll:
  Enabled: true

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - 'spec/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'

Layout/EndOfLine:
  Enabled: false

Layout/LineLength:
  Max: 120
  AllowedPatterns: ['(\A|\s)#']

Lint/AmbiguousBlockAssociation:
  Enabled: false

Style/Documentation:
  Enabled: false

RSpec/EmptyLineAfterFinalLet:
  Enabled: false

# Rails dictates where a generator lives (lib/generators/<gem>/), and its spec
# sits next to it rather than under the namespace of the class.
RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/generators/**/*.rb'
